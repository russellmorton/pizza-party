<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A pizza making game for little ones: roll the dough, spread the sauce, add the toppings and bake a pizza for a hungry monster.">
<title>Pizza Party</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: a pizzeria counter — the hungry monster and its order ticket, a big round board to work on,
   and the tools for the current step along the bottom. Single bright theme by choice, like Paint Pots. */
:root {
  --cloth: #fff3e2;
  --check: rgba(216, 57, 43, .09);
  --ink: #26314a;
  --ink-soft: #5b6782;
  --card: #ffffff;
  --tomato: #d8392b;
  --cheese: #ffc83d;
  --basil: #5a9e35;
  --font-display: "Baloo 2", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box;
}
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--cloth);
  background-image:
    linear-gradient(90deg, var(--check) 50%, transparent 50%),
    linear-gradient(var(--check) 50%, transparent 50%);
  background-size: 56px 56px;
  color: var(--ink);
  font-family: var(--font-display);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }
[hidden] { display: none !important; }

.app {
  height: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-sizing: border-box;
}

/* top bar */
.bar { display: flex; align-items: center; gap: 8px; }
.bar h1 { margin: 0; font-size: 1.6rem; font-weight: 800; line-height: 1; flex: 1; white-space: nowrap; }
.bar h1 span { display: inline-block; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
.seg { display: flex; background: var(--card); border-radius: 999px; padding: 4px; box-shadow: 0 2px 0 rgba(38,49,74,.15); }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: .95rem; color: var(--ink-soft); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.icon-btn { width: 42px; height: 42px; flex-shrink: 0; border: 0; border-radius: 50%; background: var(--card); box-shadow: 0 2px 0 rgba(38,49,74,.15); display: grid; place-items: center; }
.icon-btn svg { width: 24px; height: 24px; }

/* step chips */
.steps { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; gap: 4px; }
.steps li {
  display: flex; align-items: center; gap: 4px;
  padding: 2px 10px 2px 4px; border-radius: 999px;
  background: rgba(255,255,255,.7); color: var(--ink-soft);
  font-weight: 800; font-size: .9rem; white-space: nowrap;
  transition: background .3s, color .3s, transform .3s;
}
.steps li svg { width: 26px; height: 26px; flex-shrink: 0; }
.steps button { all: unset; display: flex; align-items: center; gap: 4px; cursor: pointer; border-radius: 999px; }
.steps button:disabled { cursor: default; }
.steps button:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.steps li:not(.now):has(button:enabled):hover { background: #fff; transform: scale(1.05); }
.steps li.now { background: var(--ink); color: #fff; transform: scale(1.08); }
.steps li.done { background: #e3f3d8; color: #2f6b1f; }
.steps li.done .tick { display: inline; }
@media (max-width: 520px) { .steps li .lbl { display: none; } .steps li { padding: 2px 4px; } .steps li.now .lbl { display: inline; } }

/* stage */
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
@media (min-aspect-ratio: 1/1) { .stage { flex-direction: row; align-items: center; gap: 24px; } }

.card {
  background: var(--card);
  border-radius: 24px;
  padding: 10px 14px;
  box-shadow: 0 4px 0 rgba(38,49,74,.12);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  position: relative;
  flex-shrink: 0;
}
@media (min-aspect-ratio: 1/1) { .card { flex-direction: column; padding: 16px 18px; width: clamp(180px, 24vw, 250px); box-sizing: border-box; } }
.creature { width: clamp(76px, 13vh, 150px); aspect-ratio: 1; border: 0; padding: 0; background: transparent; border-radius: 20px; flex-shrink: 0; }
.creature svg { width: 100%; height: 100%; overflow: visible; }
.creature.happy { animation: hop .5s ease 3; }
.creature.wiggle { animation: wiggle .5s ease 2; }
.creature.arrive { animation: arrive .7s cubic-bezier(.3,1.4,.5,1); }
@keyframes hop { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-18%) scale(1.04,.96) } 70% { transform: translateY(0) scale(1.06,.94) } }
@keyframes wiggle { 25% { transform: rotate(-8deg) } 75% { transform: rotate(8deg) } }
@keyframes arrive { from { transform: translateX(-80%) scale(.6); opacity: 0 } }

.ticket {
  background: #fffdf4;
  border: 3px dashed #e3d6b8;
  border-radius: 14px;
  padding: 6px 10px 8px;
  min-width: 128px;
  display: flex; flex-direction: column; gap: 4px;
}
.ticket-title { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); text-align: center; }
.ticket .any { margin: 0; font-weight: 800; font-size: 1.15rem; text-align: center; line-height: 1.1; text-wrap: balance; }
.ticket .line { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: .95rem; line-height: 1; min-height: 30px; border-radius: 10px; padding-inline: 2px; transition: background .3s; }
.ticket .line.full { background: #e3f3d8; }
.ticket .swatch { width: 24px; height: 24px; border-radius: 50%; border: 3px solid var(--ink); box-sizing: border-box; flex-shrink: 0; }
.ticket .dots { display: flex; gap: 3px; }
.ticket .dots i { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--ink); box-sizing: border-box; background: #fff; transition: background .2s, transform .2s; }
.ticket .dots i.on { background: var(--cheese); transform: scale(1.15); }
.ticket .extra { background: var(--tomato); color: #fff; border-radius: 999px; padding: 2px 7px; font-size: .85rem; }
.ticket .no-line { gap: 2px; }
.ticket .nope { position: relative; display: grid; }
.ticket .nope::after { content: ""; position: absolute; inset: 1px; border: 3px solid var(--tomato); border-radius: 50%; background: linear-gradient(45deg, transparent 44%, var(--tomato) 44%, var(--tomato) 56%, transparent 56%); }

.shelf { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; max-width: 200px; }
.shelf div { width: 26px; height: 26px; }
.shelf svg { width: 100%; height: 100%; }
@media (max-aspect-ratio: 1/1) { .shelf { position: absolute; top: -10px; right: 10px; max-width: 150px; } .shelf div { width: 22px; height: 22px; } }

/* the kitchen: one canvas filling the space between the order card and the tools */
.work { flex: 1; min-height: 0; min-width: 0; align-self: stretch; position: relative; }
.work canvas { position: absolute; left: 0; top: 0; display: block; touch-action: none; cursor: pointer; }

/* tool tray */
.tray { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; min-height: 112px; }
.tray .hint { margin: 0; font-weight: 800; font-size: 1.05rem; line-height: 1.2; text-align: center; min-height: 1.2em; color: var(--ink); }
.tray .tools { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; }
.tool {
  border: 0; background: var(--card); border-radius: 20px; padding: 6px 8px 4px;
  box-shadow: 0 4px 0 rgba(38,49,74,.18);
  display: flex; flex-direction: column; align-items: center; gap: 0;
  min-width: 76px; transition: transform .12s;
}
.tool:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(38,49,74,.18); }
.tool .ico { width: 54px; height: 54px; display: grid; place-items: center; }
.tool .ico svg { width: 100%; height: 100%; }
.tool .lbl { font-weight: 800; font-size: .9rem; line-height: 1.1; white-space: nowrap; }
.tool[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--ink), 0 4px 0 4px rgba(38,49,74,.18); }
.tool.bin { min-width: 70px; padding-inline: 4px; }
.tool.bin .ico { width: 46px; height: 46px; }
.tool.small { min-width: 64px; }
.tool.small .ico { width: 36px; height: 36px; }
.tool.small .lbl { font-size: .8rem; }
.tool:disabled { opacity: .4; cursor: default; }
.tool.go { background: var(--cheese); }
.tool.pulse .ico { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.12) rotate(-5deg) } }
.meter { position: relative; width: min(260px, 34vw); height: 30px; border-radius: 999px; background: var(--card); border: 3px solid var(--ink); overflow: hidden; }
.meter-fill { height: 100%; width: 0; background: linear-gradient(90deg, #ffd56a, #f0a040, #d9792f); }
.meter-pizza { position: absolute; right: 4px; top: 50%; width: 22px; height: 22px; transform: translateY(-50%); }
@media (max-width: 520px) { .tray .tools { gap: 6px; } .tool, .tool.bin, .tool.small { min-width: 0; width: 84px; padding-inline: 2px; } .tool .ico, .tool.bin .ico { width: 36px; height: 36px; } .tool .lbl, .tool.bin .lbl { font-size: .74rem; } .tray .hint { font-size: .95rem; } }

.held { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 5; filter: drop-shadow(0 10px 4px rgba(38,49,74,.3)); }
.held svg { width: 100%; height: 100%; display: block; }
body.holding .work canvas { cursor: grabbing; }
.creature.target { box-shadow: 0 0 0 5px #ffb02e; animation: wiggle .6s ease infinite; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

/* pizza party: every fifth monster */
.party {
  position: fixed; inset: 0; z-index: 20; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  background:
    radial-gradient(circle at 50% 120%, #ff9c5a 0%, transparent 60%),
    radial-gradient(circle, #ffd84a 5px, transparent 6px) 0 14px / 44px 44px repeat-x,
    linear-gradient(#5a2a6e, #2b1440);
  opacity: 0; transition: opacity .5s ease;
}
.party.on { opacity: 1; }
.party .banner {
  font-weight: 800; font-size: clamp(2.4rem, 10vw, 5rem); line-height: 1; margin-bottom: 2vh;
  color: #fff6c9; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
  text-shadow: 0 6px 0 var(--tomato);
  animation: pulse 1s ease-in-out infinite;
}
.party .guests { display: flex; gap: clamp(4px, 2vw, 20px); justify-content: center; margin-bottom: -4vh; position: relative; z-index: 1; }
.party .guest { width: min(17vw, 20vh, 150px); aspect-ratio: 1; animation: bounce .43s var(--d) ease-in-out infinite alternate; }
.party .guest svg { width: 100%; height: 100%; overflow: visible; }
@keyframes bounce { from { transform: translateY(0) rotate(-6deg) } to { transform: translateY(-18%) rotate(6deg) } }
.party .table { position: relative; z-index: 2; display: grid; place-items: center; padding: 14px; background: linear-gradient(#ffffff, #eae4da); border-radius: 50%; border: 4px solid var(--ink); box-shadow: 0 10px 0 rgba(0,0,0,.25); }
.party .table canvas { display: block; animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }
.end-party {
  position: absolute; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 16px;
  width: 44px; height: 44px; border: 0; border-radius: 50%;
  background: rgba(255,255,255,.18); color: #fff; display: grid; place-items: center;
}
.end-party svg { width: 20px; height: 20px; }

.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-height: 600px) {
  .bar h1 { font-size: 1.2rem; }
  .steps { display: none; }
  .tray { min-height: 76px; }
  .tool .ico { width: 40px; height: 40px; }
}
@media (max-width: 400px) { .bar h1 { font-size: 1.2rem; } .seg button { padding: 4px 8px; font-size: .85rem; } }
@media (prefers-reduced-motion: reduce) {
  .creature, .tool .ico, .party .banner, .party .guest, .party .table canvas { animation: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1 id="title" aria-label="Pizza Party"></h1>
    <div class="seg" role="group" aria-label="Game mode">
      <button id="mode-orders" aria-pressed="true">Orders</button>
      <button id="mode-free" aria-pressed="false">Free play</button>
    </div>
    <button class="icon-btn" id="restart" aria-label="Start this pizza again">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>
    </button>
    <button class="icon-btn" id="mute" aria-label="Sound on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
  </header>

  <ol class="steps" id="steps" aria-label="Pizza stages">
    <li><button type="button" data-step="roll" aria-label="Roll"><svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="18" rx="12" ry="8" fill="#f4d9a6" stroke="#26314a" stroke-width="2.5"/><rect x="3" y="9" width="26" height="6" rx="3" fill="#e8b06c" stroke="#26314a" stroke-width="2.5"/></svg><span class="lbl" aria-hidden="true">Roll</span></button></li>
    <li><button type="button" data-step="sauce" aria-label="Sauce"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#f4d9a6" stroke="#26314a" stroke-width="2.5"/><circle cx="16" cy="16" r="9.5" fill="#d8392b"/><g stroke="#ffe98f" stroke-width="2.5" stroke-linecap="round"><path d="M11 13l3 2M18 11l2 3M13 20l3-1M20 18l1 3"/></g></svg><span class="lbl" aria-hidden="true">Sauce</span></button></li>
    <li><button type="button" data-step="cheese" aria-label="Cheese"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 24 L27 10 L29 24 Z" fill="#ffd56a" stroke="#26314a" stroke-width="2.5" stroke-linejoin="round"/><path d="M3 24 h26 v4 h-26z" fill="#f0bd3e" stroke="#26314a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="16" cy="20" r="2" fill="#e0a92a"/><circle cx="23" cy="16" r="1.6" fill="#e0a92a"/></svg><span class="lbl" aria-hidden="true">Cheese</span></button></li>
    <li><button type="button" data-step="top" aria-label="Toppings"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#f4d9a6" stroke="#26314a" stroke-width="2.5"/><circle cx="16" cy="16" r="9.5" fill="#ffd56a"/><circle cx="12" cy="13" r="3.2" fill="#d9432c"/><circle cx="20" cy="19" r="3.2" fill="#d9432c"/><circle cx="20" cy="12" r="2.4" fill="none" stroke="#26314a" stroke-width="2"/><path d="M10 20q2-3 5 0q-2 3-5 0z" fill="#43a046"/></svg><span class="lbl" aria-hidden="true">Toppings</span></button></li>
    <li><button type="button" data-step="bake" aria-label="Bake"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 29V17C3 4 29 4 29 17v12z" fill="#d9694a" stroke="#26314a" stroke-width="2.5" stroke-linejoin="round"/><path d="M9 29v-8c0-7 14-7 14 0v8z" fill="#3a1a10"/><path d="M13 28q-1-6 3-9q0 4 2 5q1-2 1-4q3 4 0 8z" fill="#ffb02e"/></svg><span class="lbl" aria-hidden="true">Bake</span></button></li>
    <li><button type="button" data-step="cut" aria-label="Cut"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#f2c675" stroke="#26314a" stroke-width="2.5"/><path d="M16 3v26M3 16h26M6.8 6.8l18.4 18.4M25.2 6.8L6.8 25.2" stroke="#8a5232" stroke-width="1.8"/></svg><span class="lbl" aria-hidden="true">Cut</span></button></li>
    <li><button type="button" data-step="serve" aria-label="Serve"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="9" width="26" height="18" rx="2" fill="#e5b073" stroke="#26314a" stroke-width="2.5"/><circle cx="16" cy="18" r="5.5" fill="#d8392b" stroke="#26314a" stroke-width="2"/><path d="M3 9l4-5h18l4 5" fill="#dba465" stroke="#26314a" stroke-width="2.5" stroke-linejoin="round"/></svg><span class="lbl" aria-hidden="true">Serve</span></button></li>
  </ol>

  <main class="stage">
    <section class="card" aria-live="polite">
      <div class="shelf" id="shelf"></div>
      <button class="creature" id="creature"></button>
      <div class="ticket" id="ticket"></div>
    </section>
    <div class="work" id="work">
      <canvas id="work-canvas" role="img" aria-label="The kitchen" tabindex="0"></canvas>
    </div>
  </main>

  <nav class="tray" id="tray" aria-label="Tools"></nav>
  <div class="vh" id="announce" aria-live="assertive"></div>
</div>
<canvas id="confetti"></canvas>

<script type="module" src="src/game.js"></script>
<script type="module" src="src/analytics.js"></script>
</body>
</html>
